[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logistics-control-tower"
version = "0.1.0"
description = "Agentic Fulfillment Orchestration for the Corp B x Corp A MCF pilot (cloud-agnostic core, Azure first)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.17",
  "azure-servicebus>=7.12",
  "azure-cosmos>=4.7",
  "azure-storage-blob>=12.20",
  "azure-keyvault-secrets>=4.8",
  "azure-appconfiguration>=1.6",
  "azure-communication-email>=1.0",
  "pyodbc>=5.1",
  "anthropic>=0.70",
  "starlette>=0.40",
  "uvicorn>=0.30",
]
dev = ["pytest>=8", "starlette>=0.40", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tower*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

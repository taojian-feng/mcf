name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pydantic>=2.6" pytest "starlette>=0.40" "httpx>=0.27"
      - run: python -m pytest
  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install && az bicep build --file infra/azure/main.bicep --stdout > /dev/null
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mcf-agents:ci .
      - name: Image imports the Azure adapters
        run: docker run --rm mcf-agents:ci python -c "import pyodbc, uvicorn, tower.adapters.azure, tower.main, tower.edge.gateway, tower.edge.console, evals.exceptions; print(pyodbc.drivers())"
      - run: docker build -f sim/Dockerfile -t partner-sims:ci .
      - name: Simulators image imports both partners
        run: docker run --rm partner-sims:ci python -c "import sim.corpa.__main__, sim.corpb.__main__, azure.cosmos, azure.storage.blob"

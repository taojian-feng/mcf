# Deploys the dev environment to Azure. Manual only: Actions > Deploy to Azure (dev) > Run workflow.
# One-time setup: run infra/azure/bootstrap.sh in Azure Cloud Shell, then add the values it prints
# as repository secrets and variables. See docs/DEPLOY_AZURE.md.
name: Deploy to Azure (dev)

on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Check the partner endpoints and run the reconciliation job once after deploying
        type: boolean
        default: true
      sql_location:
        description: Region for the audit database (blank tries the resource group's region, then a few others)
        type: string
        default: ''

permissions:
  id-token: write   # GitHub OIDC token for azure/login
  contents: read

concurrency: { group: deploy-azure-dev, cancel-in-progress: false }

env:
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  PREFIX: mcfpilot
  PLACEHOLDER_IMAGE: mcr.microsoft.com/k8se/quickstart:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check setup
        run: |
          [ -n "$RG" ] || { echo "::error::Repository variable AZURE_RESOURCE_GROUP is not set"; exit 1; }
          [ -n "${{ vars.AZURE_DEPLOYER_OBJECT_ID }}" ] && [ -n "${{ vars.SQL_ADMIN_GROUP_ID }}" ] && [ -n "${{ vars.SQL_ADMIN_GROUP_NAME }}" ] \
            || { echo "::error::Run infra/azure/bootstrap.sh and add the variables it prints"; exit 1; }
          az group show -n "$RG" --query location -o tsv

      - name: Pick the audit database region
        run: |
          # Keep the audit database where it already is; otherwise try regions in order.
          existing=$(az sql server list -g "$RG" --query "[?state=='Ready'] | [0].location" -o tsv 2>/dev/null || true)
          rg_location=$(az group show -n "$RG" --query location -o tsv)
          echo "SQL_REGIONS=${existing:-${{ inputs.sql_location }}} $rg_location centralus westus3 northcentralus southcentralus" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/deploy.sh" <<'SH'
          # deploy.sh <name> <agents image> <simulators image>: deploy main.bicep, trying SQL regions in order.
          set -u
          for region in $SQL_REGIONS; do
            echo "Deploying ($1) with the audit database in $region"
            if az deployment group create -g "$RG" -n "mcf-$1-$GITHUB_RUN_NUMBER" -f infra/azure/main.bicep \
                 -p prefix="$PREFIX" image="$2" simImage="$3" sqlLocation="$region" \
                    sqlAdminGroupObjectId="$SQL_ADMIN_GROUP_ID" sqlAdminGroupName="$SQL_ADMIN_GROUP_NAME" \
                    deployerPrincipalId="$DEPLOYER_ID" \
                 --query properties.outputs -o json > outputs.json 2> deploy-err.txt; then
              exit 0
            fi
            cat deploy-err.txt
            grep -q RegionDoesNotAllowProvisioning deploy-err.txt || exit 1
            echo "::warning::$region is not accepting new Azure SQL servers; trying the next region"
          done
          echo "::error::No region in '$SQL_REGIONS' accepted a new Azure SQL server"; exit 1
          SH

      - name: First deploy only - create the infrastructure with placeholder images
        env: { SQL_ADMIN_GROUP_ID: "${{ vars.SQL_ADMIN_GROUP_ID }}", SQL_ADMIN_GROUP_NAME: "${{ vars.SQL_ADMIN_GROUP_NAME }}", DEPLOYER_ID: "${{ vars.AZURE_DEPLOYER_OBJECT_ID }}" }
        run: |
          acr=$(az acr list -g "$RG" --query "[?starts_with(name, '${PREFIX}acr')] | [0].name" -o tsv)
          if [ -z "$acr" ]; then
            bash "$RUNNER_TEMP/deploy.sh" bootstrap "$PLACEHOLDER_IMAGE" "$PLACEHOLDER_IMAGE"
            acr=$(jq -r .acrName.value outputs.json)
          fi
          echo "ACR_NAME=$acr" >> "$GITHUB_ENV"
          echo "ACR_SERVER=$(az acr show -n "$acr" --query loginServer -o tsv)" >> "$GITHUB_ENV"
          echo "KV_NAME=$(az keyvault list -g "$RG" --query "[?starts_with(name, '${PREFIX}-kv')] | [0].name" -o tsv)" >> "$GITHUB_ENV"

      - name: Build and push the agents and partner simulator images
        run: |
          tag="${GITHUB_SHA::12}"
          az acr login -n "$ACR_NAME"
          docker build -t "$ACR_SERVER/mcf-agents:$tag" .
          docker build -f sim/Dockerfile -t "$ACR_SERVER/partner-sims:$tag" .
          docker push "$ACR_SERVER/mcf-agents:$tag"
          docker push "$ACR_SERVER/partner-sims:$tag"
          echo "IMAGE=$ACR_SERVER/mcf-agents:$tag" >> "$GITHUB_ENV"
          echo "SIM_IMAGE=$ACR_SERVER/partner-sims:$tag" >> "$GITHUB_ENV"

      - name: Seed keys and partner credentials (only those absent)
        run: |
          # pii-masking-key: PII field masking. The rest are what the partners and the system share:
          # Corp A's OAuth client for the MCF API, Corp A's webhook signing secret, and an API key each way with Corp B.
          seed() {
            for i in 1 2 3 4 5 6; do   # role assignments made by the template can take a minute to apply
              if az keyvault secret show --vault-name "$KV_NAME" -n "$1" --query id -o tsv >/dev/null 2>err.txt; then
                echo "$1: exists"; return
              elif grep -q SecretNotFound err.txt; then
                az keyvault secret set --vault-name "$KV_NAME" -n "$1" --value "$2" --query id -o tsv >/dev/null
                echo "$1: created"; return
              fi
              cat err.txt; sleep 20
            done
            exit 1
          }
          seed pii-masking-key "$(openssl rand -hex 32)"
          seed mcf-client-id "corpb-mcf-pilot"
          seed mcf-client-secret "$(openssl rand -hex 32)"
          seed partner-corpa-webhook-secret "$(openssl rand -hex 32)"
          seed partner-corpb-api-key "$(openssl rand -hex 24)"
          seed corpb-inbound-api-key "$(openssl rand -hex 24)"
          seed approval-link-key "$(openssl rand -hex 32)"   # signs the console links in approval emails

      - name: Deploy infrastructure and the new images
        env: { SQL_ADMIN_GROUP_ID: "${{ vars.SQL_ADMIN_GROUP_ID }}", SQL_ADMIN_GROUP_NAME: "${{ vars.SQL_ADMIN_GROUP_NAME }}", DEPLOYER_ID: "${{ vars.AZURE_DEPLOYER_OBJECT_ID }}" }
        run: |
          bash "$RUNNER_TEMP/deploy.sh" infra "$IMAGE" "$SIM_IMAGE"
          out() { jq -r ".$1.value" outputs.json; }
          {
            echo "APPCFG_URL=$(out appConfigUrl)"
            echo "SQL_FQDN=$(out sqlServer)";          echo "SQL_NAME=$(out sqlServerName)"
            echo "SQL_LOCATION=$(out sqlLocation)"
            echo "UAMI_NAME=$(out agentsIdentityName)"; echo "UAMI_CLIENT_ID=$(out agentsIdentityClientId)"
            echo "CONSOLE_URL=$(out consoleUrl)";      echo "FOUNDRY_RESOURCE=$(out foundryResource)"
            echo "GATEWAY_URL=$(out gatewayUrl)";      echo "CORPA_URL=$(out corpaUrl)"; echo "CORPB_URL=$(out corpbUrl)"
          } >> "$GITHUB_ENV"

      - name: Seed pilot settings and sync people from config/pilot.yaml
        env:
          PILOT_PEOPLE: ${{ secrets.PILOT_PEOPLE }}   # optional: the same YAML, kept out of the repo
        run: |
          pip install --quiet pydantic pyyaml
          for i in 1 2 3 4 5 6; do az appconfig kv list --endpoint "$APPCFG_URL" --auth-mode login --top 1 -o none 2>/dev/null && break; sleep 20; done
          put() {
            az appconfig kv set --endpoint "$APPCFG_URL" --auth-mode login --key "$1" --value "$2" \
              --content-type application/json --yes -o none
          }
          # Thresholds and nodes: seeded once, then edited in the portal.
          if ! az appconfig kv show --endpoint "$APPCFG_URL" --auth-mode login --key mcf:pilot_config -o none 2>/dev/null; then
            put mcf:pilot_config "$(python -c 'from tower.core.config import PilotConfig; print(PilotConfig().model_dump_json())')"
          fi
          # People: the file (or the PILOT_PEOPLE secret) is the source of truth on every deploy.
          src=config/pilot.yaml
          if [ -n "$PILOT_PEOPLE" ]; then printf '%s' "$PILOT_PEOPLE" > "$RUNNER_TEMP/pilot.yaml"; src="$RUNNER_TEMP/pilot.yaml"; fi
          python -m tower.tools.people "$src" > people.json
          for key in mcf:roles mcf:contacts mcf:pilot_authorization_list; do put "$key" "$(jq -c --arg k "$key" '.[$k]' people.json)"; done
          echo "People synced from $([ -n "$PILOT_PEOPLE" ] && echo 'the PILOT_PEOPLE secret' || echo config/pilot.yaml):"
          jq -r '"  \(.["mcf:roles"] | length) people with approver roles, \(.["mcf:contacts"] | length) alert contacts filled"' people.json

      - name: Create the audit ledger tables
        run: |
          curl -fsSL https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.2/sqlcmd-linux-amd64.tar.bz2 | tar -xj -C "$RUNNER_TEMP" sqlcmd
          export PATH="$RUNNER_TEMP:$PATH"
          ip=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "$RG" -s "$SQL_NAME" -n gh-runner --start-ip-address "$ip" --end-ip-address "$ip" -o none
          trap 'az sql server firewall-rule delete -g "$RG" -s "$SQL_NAME" -n gh-runner' EXIT
          # The serverless database may be paused; the first connection wakes it.
          for i in 1 2 3 4 5; do
            sqlcmd -S "$SQL_FQDN" -d mcf-audit --authentication-method ActiveDirectoryDefault -l 60 -b \
              -v AGENTS_IDENTITY_NAME="$UAMI_NAME" -v AGENTS_CLIENT_ID="$UAMI_CLIENT_ID" \
              -i infra/azure/sql/audit.sql && exit 0
            sleep 30
          done
          exit 1

      - name: Smoke test (console and partners answer, reconciliation job runs)
        if: ${{ inputs.smoke_test }}
        run: |
          for url in "$CONSOLE_URL" "$GATEWAY_URL" "$CORPA_URL" "$CORPB_URL"; do
            [ -n "$url" ] || continue
            for i in $(seq 1 30); do curl -fsS "$url/healthz" && echo && break; sleep 10; done
            curl -fsS "$url/healthz" >/dev/null || { echo "::error::$url/healthz is not answering"; exit 1; }
          done
          job="$PREFIX-reconciliation-daily"
          run=$(az containerapp job start -g "$RG" -n "$job" --query name -o tsv)
          echo "started $run"
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show -g "$RG" -n "$job" --job-execution-name "$run" --query properties.status -o tsv)
            echo "$status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "::error::Job $run ended $status. Logs: az containerapp job logs show -g $RG -n $job --execution $run --container job"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Job $run did not finish in 10 minutes"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Control Tower dev deploy"
            echo "- Resource group: \`$RG\`"
            echo "- Images: \`${IMAGE:-not built}\`, \`${SIM_IMAGE:-not built}\`"
            if [ -n "${CONSOLE_URL:-}" ]; then echo "- Approval console: $CONSOLE_URL (open it from the link in an approval email)"; fi
            if [ -n "${GATEWAY_URL:-}" ]; then echo "- Partner gateway: $GATEWAY_URL (Corp A MCF API: $CORPA_URL, Corp B OMS: $CORPB_URL)"; fi
            if [ -n "${FOUNDRY_RESOURCE:-}" ]; then echo "- Claude: Foundry resource \`$FOUNDRY_RESOURCE\`. Deploy the model \`claude-opus-5-5\` there once in ai.azure.com (docs/DEPLOY_AZURE.md, Claude)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
